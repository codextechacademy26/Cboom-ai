<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050d">
<title>Codex AI</title>
<style>
:root{--c1:#00e5ff;--c2:#7c5cff;--c3:#ff3df0;--ink:#eaf6ff;--mut:#9fb4d9;--panel:rgba(8,12,30,.78);--line:rgba(0,229,255,.5);--grad:linear-gradient(135deg,#00e5ff,#7c5cff 55%,#ff3df0);--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#03050d;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 36%,#1d1050 0%,#0a0b26 42%,#03050d 80%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(ellipse at 50% 36%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 36%,#000 0%,transparent 75%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#orb{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.pw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;text-align:center;font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);z-index:2;pointer-events:none}
.pw b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;z-index:3}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c1)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1),0 0 20px var(--c2)}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--c1);font-size:1.1rem;cursor:pointer}
.ic.on{background:var(--grad);color:#03050d;border-color:transparent}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3}
#chat{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:34vh;overflow:hidden;justify-content:flex-end}
.m{padding:9px 12px;border-radius:12px;border:1px solid var(--line);border-left:3px solid var(--c2);background:var(--panel);font-size:.92rem;line-height:1.4}
.m b{display:inline-block;margin-right:8px;padding:1px 7px;border-radius:5px;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;background:var(--c1);color:#03050d}
.m.you b{background:var(--c3)}
#hint{text-align:center;color:var(--c1);font-family:var(--mono);font-size:.84rem;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
#hint::before{content:"\203A ";color:var(--c3)}
.bar{display:flex;justify-content:center;align-items:center;gap:22px}
.big{width:74px;height:74px;border-radius:50%;border:0;background:var(--grad);font-size:1.8rem;cursor:pointer;box-shadow:0 0 26px rgba(124,92,255,.85),0 0 60px rgba(0,229,255,.35)}
.big.live{animation:pl 1s infinite;box-shadow:0 0 30px rgba(255,61,240,.9),0 0 70px rgba(0,229,255,.5)}
@keyframes pl{50%{transform:scale(1.08)}}
#openbtn{display:none;width:100%;margin-bottom:10px;padding:13px;border-radius:12px;background:var(--grad);color:#03050d;font-size:1rem;font-weight:700;text-align:center;text-decoration:none}
#openbtn.show{display:block}
.app{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:6px;border-radius:10px;background:#10143a;font-size:.88rem;word-break:break-all}
.app button{background:none;border:0;color:var(--c3);font-size:1.05rem;padding:0 4px}
#tf{display:none;gap:8px;margin-top:12px}
#tf.show{display:flex}
#ti{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,12,30,.92);color:#fff;font-size:1rem;outline:0}
#tf button{padding:0 18px;border:0;border-radius:12px;background:var(--grad);color:#03050d;font-weight:700}
#set{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:9}
#set.show{display:flex}
.sheet{width:100%;max-height:85%;overflow:auto;background:#0a0d22;border-top:1px solid var(--c1);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.sheet h2{margin:0 0 14px;font-size:1.05rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
.sheet label{display:block;margin:14px 0 6px;color:var(--mut);font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.sheet select,.sheet input[type=range]{width:100%}
.sheet input[type=range]{accent-color:#7c5cff}
.sheet select,.sheet input[type=text],.sheet input[type=password]{width:100%;padding:11px;border-radius:10px;background:#10143a;color:#fff;border:1px solid var(--line);font-size:.95rem}
.sheet input[type=text],.sheet input[type=password]{margin-top:6px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#10143a;color:var(--ink);font-size:.95rem}
.row button.p{background:var(--grad);color:#03050d;border:0;font-weight:700}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="top">
  <div class="pill"><i></i><span id="nm"></span></div>
  <div style="display:flex;gap:8px"><button class="ic" id="hf" aria-label="Hands-free">∞</button><button class="ic" id="gear" aria-label="Settings">⚙</button></div>
</div>
<div class="pw" id="pw"></div>
<div class="dock">
  <div id="chat"></div>
  <a id="openbtn" href="#"></a>
  <div id="hint">Tap the glowing orb to speak</div>
  <div class="bar"><button class="ic" id="kb" aria-label="Keyboard">⌨</button><button class="big" id="mic" aria-label="Speak">🎤</button><button class="ic" id="stop" aria-label="Stop">■</button></div>
  <form id="tf"><input id="ti" placeholder="Type a message…" autocomplete="off"><button>Send</button></form>
</div>
<div id="set"><div class="sheet">
  <h2>Voice settings</h2>
  <label>Voice mode</label>
  <select id="vmode"><option value="choose">1. Choose a voice</option><option value="clone">2. Clone my voice</option></select>
  <div id="pchoose">
    <label>Voice engine</label>
    <select id="eng"><option value="cloud">Cloud voices (Gemini, natural)</option><option value="phone">Phone voice (offline)</option></select>
    <label>Cloud voice (30 to choose from)</label>
    <select id="cvoice"></select>
    <input type="text" id="ttsm" placeholder="TTS model" autocomplete="off">
    <label>Phone voice (offline engine)</label>
    <select id="vsel"></select>
    <label>Phone voice style</label>
    <select id="ssel"></select>
  </div>
  <div id="pclone">
    <label>ElevenLabs API key (cloning needs a paid plan)</label>
    <input type="password" id="elk" placeholder="Paste your ElevenLabs key" autocomplete="off">
    <input type="text" id="elm" placeholder="Model" autocomplete="off">
    <label>Your voice sample (only record your own voice)</label>
    <div class="row"><button id="recbtn">● Record</button><button id="mkclone" class="p">Create my clone</button></div>
    <div id="clonemsg" style="color:var(--mut);font-size:.82rem;margin-top:8px"></div>
  </div>
  <label>Speed</label>
  <input type="range" id="rate" min="0.6" max="1.5" step="0.05">
  <label>Hall echo (cloud and clone voices)</label>
  <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><input type="checkbox" id="echo" style="width:22px;height:22px"><span style="font-size:.85rem">School-hall announcement echo</span></div>
  <label>Echo strength</label>
  <input type="range" id="eamt" min="0" max="100" step="5">
  <div id="ttsmsg" style="color:var(--mut);font-size:.82rem;margin-top:8px"></div>
  <label>AI brain (answers any question)</label>
  <select id="aip"><option value="gemini">Gemini (Google)</option><option value="openai">ChatGPT (OpenAI)</option><option value="grok">Grok (xAI)</option></select>
  <input type="password" id="aik" placeholder="Paste your API key" autocomplete="off">
  <input type="text" id="aim" placeholder="Model name" autocomplete="off">
  <div class="row"><button id="aitest">Test AI</button></div>
  <div id="aimsg" style="color:var(--mut);font-size:.82rem;margin-top:8px"></div>
  <label>Notes (say “take a note …”)</label>
  <div id="notelist"></div>
  <label>My apps: opens the app’s Play Store page (tap Open there)</label>
  <input type="text" id="an" placeholder="App name, e.g. grand mobile">
  <input type="text" id="ap" placeholder="Package name, e.g. com.grand.launcher">
  <div class="row"><button id="addapp">Add app</button></div>
  <div id="appmsg" style="color:var(--mut);font-size:.82rem;margin-top:8px"></div>
  <div id="applist"></div>
  <div class="row"><button id="test">Test voice</button><button class="p" id="close">Done</button></div>
</div></div>

<script src="config.js"></script>
<script>
const NAME="Codex AI";
const POWERED="codextechacademy26";
const DEF_KEY=(typeof window.DEFAULT_KEY==="string"?window.DEFAULT_KEY:"");
const KEYOF=()=>(((S.ai&&S.ai.k)||DEF_KEY||"")+"").trim();
const NATIVE=typeof Android!=="undefined"&&!!Android.isNative&&Android.isNative();
const $=id=>document.getElementById(id);
$("nm").textContent=NAME;
$("pw").innerHTML="Powered by <b></b>";$("pw").querySelector("b").textContent=POWERED;

/* ---------- settings ---------- */
const STYLES={normal:["Normal",1,1],deep:["Deep",.6,.92],bright:["Bright",1.45,1.05],robot:["Robot",.75,.88],fast:["Quick",1.1,1.25],calm:["Calm",.9,.8]};
let S={voice:"",style:"normal",rate:1,hands:false,apps:{},ai:{p:"gemini",k:"",m:""},eng:"cloud",tts:{v:"Kore",m:""},echo:true,echoAmt:60,mode:"choose",el:{k:"",m:"",id:""},notes:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("cboomai")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cboomai",JSON.stringify(S))}catch(e){}};

/* ---------- orb ---------- */
const cv=$("orb"),cx=cv.getContext("2d");
let W,H,R,D=window.devicePixelRatio||1,state="idle",t=0,amp=.04,spin=0;
function size(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;R=Math.min(W,H)*.3}
addEventListener("resize",size);size();
const N=1100,P=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;P.push({x:Math.cos(a)*r,y:y,z:Math.sin(a)*r,s:Math.random()*6})}
function draw(){
  t+=.008;
  const tg={idle:.03,listening:.12,thinking:.08,speaking:.16}[state];
  amp+=(tg-amp)*.05;
  let pulse=0;
  if(state==="speaking")pulse=(Math.sin(t*38)*.5+.5)*(Math.sin(t*11)*.5+.5)*.14;
  if(state==="listening")pulse=(Math.sin(t*9)*.5+.5)*.05;
  const boost=state==="thinking"?3:state==="speaking"?1.8:state==="listening"?1.4:1;
  spin+=.008*boost;
  const cs=Math.cos(spin),sn=Math.sin(spin),cxc=W/2,cyc=H*.36;
  cx.globalCompositeOperation="source-over";
  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(cxc,cyc,R*.2,cxc,cyc,R*1.9);
  g.addColorStop(0,"rgba(124,92,255,"+(.26+amp)+")");g.addColorStop(.55,"rgba(0,229,255,.07)");g.addColorStop(1,"rgba(0,0,0,0)");
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){
    const p=P[i],x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs,y=p.y;
    const k=1+amp*Math.sin(t*3+p.s)+pulse,per=1.6/(2.3-z),sc=R*k*per;
    const al=.25+.75*(z+1)/2,hue=185+(y*.5+.5)*135+Math.sin(t+p.s)*12;
    const core=Math.max(0,z)*Math.max(0,1-Math.hypot(x,y)),s=((z+1.2)+.5)*D;
    cx.fillStyle="hsla("+hue+",100%,"+(55+core*40|0)+"%,"+al*.9+")";
    cx.fillRect(cxc+x*sc,cyc+y*sc,s,s);
  }
  const rings=[[1.15,.5,.9,185],[1.35,-.9,-.7,300],[1.55,1.3,.45,265]];
  for(let j=0;j<3;j++){
    const rad=rings[j][0],tilt=rings[j][1],spd=rings[j][2],hue=rings[j][3];
    const ct=Math.cos(tilt),st=Math.sin(tilt),sp=spin*spd,c2=Math.cos(sp),s2=Math.sin(sp);
    for(let i=0;i<150;i++){
      if(i%10>6)continue;
      const a=i/150*6.2832,x0=Math.cos(a),z0=Math.sin(a);
      const x1=x0*ct,y1=x0*st,x2=x1*c2+z0*s2,z2=-x1*s2+z0*c2;
      const per=1.6/(2.3-z2),sc=R*rad*(1+amp*.5)*per,al=.2+.8*(z2+1)/2,s=((1.2+z2)*1.1+.4)*D;
      cx.fillStyle="hsla("+hue+",100%,65%,"+al+")";
      cx.fillRect(cxc+x2*sc,cyc+y1*sc,s,s);
    }
  }
  cx.globalCompositeOperation="source-over";
  cx.lineWidth=D*1.2;cx.strokeStyle="rgba(0,229,255,.55)";cx.beginPath();
  for(let i=0;i<72;i++){const a=i/72*6.2832+spin*.3,r1=R*1.45,r2=R*(i%6===0?1.58:1.52);cx.moveTo(cxc+Math.cos(a)*r1,cyc+Math.sin(a)*r1);cx.lineTo(cxc+Math.cos(a)*r2,cyc+Math.sin(a)*r2)}
  cx.stroke();
  cx.lineWidth=D*2;
  cx.strokeStyle="rgba(255,61,240,.8)";cx.beginPath();cx.arc(cxc,cyc,R*1.34,spin*1.2,spin*1.2+1.1);cx.stroke();
  cx.strokeStyle="rgba(124,92,255,.9)";cx.beginPath();cx.arc(cxc,cyc,R*1.34,spin*1.2+3.14,spin*1.2+3.9);cx.stroke();
  requestAnimationFrame(draw);
}
draw();
function setState(s){state=s;$("mic").classList.toggle("live",s==="listening")}
const hint=t=>$("hint").textContent=t;

/* ---------- chat ---------- */
const msgs=[];
function addMsg(who,text){
  msgs.push({who,text});if(msgs.length>4)msgs.shift();
  $("chat").innerHTML="";
  msgs.forEach(m=>{const d=document.createElement("div");d.className="m "+m.who;const b=document.createElement("b");b.textContent=m.who==="you"?"YOU":NAME.toUpperCase();d.appendChild(b);d.appendChild(document.createTextNode(m.text));$("chat").appendChild(d)});
}

/* ---------- brain (offline answers for now) ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dev=(c,a)=>NATIVE?Android.device(c,a||""):"";
const NOAPP="That works in the Codex AI app.";
const NEEDC="I need permission to read your contacts. Allow it in your phone settings, then try again.";
function findContact(name){const r=Android.contact(name);if(!r||r==="denied")return r;const p=r.split("|");return{name:p[0],num:p[1],e164:p[2]||p[1]}}
const jokes=["Why do programmers prefer dark mode? Because light attracts bugs.","I told my phone I needed space. Now it won’t stop showing me storage warnings.","Why did the developer go broke? Because he used up all his cache.","There are 10 kinds of people: those who understand binary and those who don’t.","Why was the computer cold? It left its Windows open."];
const facts=["Honey never spoils. People have found edible honey in ancient tombs.","Octopuses have three hearts.","A day on Venus is longer than a year on Venus.","Bananas are berries, but strawberries are not.","Your brain uses about twenty percent of your body’s energy."];
const APPS={whatsapp:["com.whatsapp","wa.me","https","https://wa.me/"],youtube:["com.google.android.youtube","www.youtube.com","https","https://www.youtube.com"],tiktok:["com.zhiliaoapp.musically","www.tiktok.com","https","https://www.tiktok.com"],instagram:["com.instagram.android","www.instagram.com","https","https://www.instagram.com"],telegram:["org.telegram.messenger","t.me","https","https://web.telegram.org"],facebook:["com.facebook.katana","www.facebook.com","https","https://www.facebook.com"],messenger:["com.facebook.orca","m.me","https","https://www.messenger.com"],gmail:["com.google.android.gm","","mailto","https://mail.google.com"],maps:["com.google.android.apps.maps","maps.google.com","https","https://maps.google.com"],"play store":["com.android.vending","play.google.com","https","https://play.google.com/store"],snapchat:["com.snapchat.android","www.snapchat.com","https","https://www.snapchat.com"],twitter:["com.twitter.android","x.com","https","https://x.com"],spotify:["com.spotify.music","open.spotify.com","https","https://open.spotify.com"],netflix:["com.netflix.mediaclient","www.netflix.com","https","https://www.netflix.com"]};
const WEB={google:"https://www.google.com",chrome:"https://www.google.com","grand mobile":"https://play.google.com/store/apps/details?id=com.grand.launcher"};
const appUrl=a=>"intent://"+a[1]+(a[1]?"/":"")+"#Intent;scheme="+a[2]+";package="+a[0]+";S.browser_fallback_url="+encodeURIComponent(a[3])+";end";
function findApp(n){
  const all={};
  for(const k in APPS)all[k]=appUrl(APPS[k]);
  for(const k in WEB)all[k]=WEB[k];
  for(const k in S.apps)all[k]="https://play.google.com/store/apps/details?id="+S.apps[k];
  const k=all[n]?n:(n.length>2?Object.keys(all).find(x=>x.length>3&&(n.includes(x)||x.includes(n))):null);
  return k?all[k]:null;
}
const NW={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9};
function digits(s){s=s.replace(/\b(zero|oh|one|two|three|four|five|six|seven|eight|nine)\b/g,w=>NW[w]);const p=s.trim().startsWith("+")?"+":"";const d=s.replace(/\D/g,"");return d.length>=5?p+d:""}
const gs=q=>"https://www.google.com/search?q="+encodeURIComponent(q);
function norm(s){return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9+\-*/.()\s]/g," ").replace(/\s+/g," ").trim()}
function think(raw){
  const q=norm(raw),has=(...w)=>w.some(x=>q.includes(x));let m;
  if(!q)return{t:"I didn’t catch that. Try again."};
  if(/^(hi|hello|hey|yo|hola)\b/.test(q)||has("good morning","good afternoon","good evening"))return{t:pick(["Hello! How can I help you?","Hey there! What can I do for you?","Hi! I’m listening."])};
  if(has("your name","who are you"))return{t:"I’m "+NAME+", your hands-free voice assistant."};
  if(has("who made you","who created you","who built you"))return{t:"I was built by Cboom APKs."};
  if(has("how are you"))return{t:"I’m doing great, thanks for asking. How about you?"};
  if(has("what can you do","help me","your features"))return{t:"I can tell the time and date, do math, tell jokes and facts, flip a coin, roll a dice, open apps on your phone, make calls, send texts, control the flashlight and volume, set alarms and timers, check the battery, open the camera, and search Google for you."};
  if(has("what time","the time","current time"))return{t:"It’s "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"."};
  if(has("the date","what day","todays date","date today"))return{t:"Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+"."};
  if(has("flip a coin","toss a coin","coin flip"))return{t:"It’s "+pick(["heads","tails"])+"."};
  if(has("roll a dice","roll a die","roll dice"))return{t:"You rolled a "+(1+Math.floor(Math.random()*6))+"."};
  if(has("joke","make me laugh"))return{t:pick(jokes)};
  if(has("fact"))return{t:pick(facts)};
  if(has("thank"))return{t:pick(["You’re welcome!","Anytime!","Happy to help."])};
  if(/^(bye|goodbye|see you)/.test(q))return{t:"Goodbye! Talk to you soon."};
  if(has("weather","temperature","forecast"))return{t:"I can’t check live weather yet. That will work once the AI connection is added. I can search it on Google for you.",go:gs(raw)};

  const k=KEYOF(),m=(S.tts.m||"").trim()||TTS_DEF;
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent";
  const body=JSON.stringify({contents:[{parts:[{text:text.slice(0,600)}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:S.tts.v||"Kore"}}}}});
  const r=await post(url,{"Content-Type":"application/json","x-goog-api-key":k},body);
  if(r.status<200||r.status>=300){let msg="";try{const er=JSON.parse(r.text);msg=(er.error&&er.error.message)||""}catch(x){msg=(r.text||"").slice(0,100)}throw{status:r.status,msg:msg}}
  let j;try{j=JSON.parse(r.text)}catch(e){throw{status:-1,msg:"Unreadable reply"}}
  const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
  let inl=null;for(const q of parts){if(q.inlineData||q.inline_data){inl=q.inlineData||q.inline_data;break}}
  if(!inl||!inl.data)throw{status:-1,msg:"No audio came back"};
  const rate=+((/rate=(\d+)/.exec(inl.mimeType||inl.mime_type||"")||[])[1]||24000);
  const bin=atob(inl.data),n=bin.length>>1,f=new Float32Array(n);
  for(let i=0;i<n;i++){let x=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(x>=32768)x-=65536;f[i]=x/32768}
  const ctx=await getCtx();
  const buf=ctx.createBuffer(1,n,rate);buf.copyToChannel(f,0);
  playBuf(ctx,buf,end);
}
async function getCtx(){
  const ctx=actx||(actx=new (window.AudioContext||window.webkitAudioContext)());
  if(ctx.state==="suspended")await ctx.resume();
  if(ctx.state!=="running")throw{status:0,msg:"Audio is blocked"};
  return ctx;
}
function playBuf(ctx,buf,end){
  stopCloud();
  const src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=Math.min(1.6,Math.max(.6,S.rate));
  buildChain(ctx,src);cloudSrc=src;setState("speaking");
  src.onended=()=>{cloudSrc=null;setTimeout(end,S.echo?1400:0)};
  src.start();
}
const EL_DEF="eleven_multilingual_v2";
function postBin(url,headers,body){
  return new Promise((res,rej)=>{
    if(NATIVE){
      const id="b"+Date.now()+Math.floor(Math.random()*1e6);
      httpPend[id]=(status,text)=>{
        if(status<=0)return rej({status:0});
        if(status>=200&&status<300){const bin=atob(text),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);res({status:status,buf:a.buffer})}
        else{let m=text;try{const j=JSON.parse(text);m=(j.detail&&(j.detail.message||j.detail))||m}catch(x){}res({status:status,errText:String(m).slice(0,140)})}
      };
      setTimeout(()=>{if(httpPend[id]){delete httpPend[id];rej({status:0})}},40000);
      Android.httpBin(id,url,JSON.stringify(headers),body);
    }else fetch(url,{method:"POST",headers:headers,body:body}).then(async r=>{if(r.ok)res({status:r.status,buf:await r.arrayBuffer()});else{const t=await r.text();res({status:r.status,errText:t.slice(0,140)})}}).catch(()=>rej({status:0}));
  });
}
async function elSpeak(text,end){
  const url="https://api.elevenlabs.io/v1/text-to-speech/"+encodeURIComponent(S.el.id)+"?output_format=mp3_44100_128";
  const body=JSON.stringify({text:text.slice(0,600),model_id:(S.el.m||"").trim()||EL_DEF});
  const r=await postBin(url,{"Content-Type":"application/json","xi-api-key":S.el.k.trim()},body);
  if(r.status<200||r.status>=300)throw{status:r.status,msg:r.errText};
  const ctx=await getCtx();
  const buf=await new Promise((res,rej)=>ctx.decodeAudioData(r.buf,res,rej));
  playBuf(ctx,buf,end);
}
