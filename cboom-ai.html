<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050007">
<title>Cboom AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#050007;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 38%,#4a0014 0%,#16000a 45%,#050007 80%)}
#orb{position:fixed;inset:0;width:100%;height:100%}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;z-index:3}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid #ff2a52;background:rgba(80,0,20,.55);font-size:.95rem}
.pill i{width:9px;height:9px;border-radius:50%;background:#ff2a52;box-shadow:0 0 8px #ff2a52}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid #ff2a52;background:rgba(80,0,20,.55);color:#fff;font-size:1.15rem;cursor:pointer}
.ic.on{background:#ff2a52}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3}
#chat{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:34vh;overflow:hidden;justify-content:flex-end}
.m{padding:9px 12px;border-radius:14px;border:1px solid rgba(255,42,82,.55);background:rgba(40,0,12,.72);font-size:.92rem;line-height:1.4}
.m b{display:inline-block;margin-right:8px;padding:1px 7px;border-radius:6px;font-size:.68rem;letter-spacing:.5px;background:#ff2a52;color:#fff}
.m.you b{background:#fff;color:#7a0020}
#hint{text-align:center;color:#ffb3c2;font-size:.88rem;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,42,82,.45);background:rgba(40,0,12,.6);margin-bottom:12px}
.bar{display:flex;justify-content:center;align-items:center;gap:22px}
.big{width:74px;height:74px;border-radius:50%;border:0;background:#fff;font-size:1.8rem;cursor:pointer;box-shadow:0 0 26px rgba(255,42,82,.8)}
.big.live{background:#ff2a52;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.08)}}
#tf{display:none;gap:8px;margin-top:12px}
#tf.show{display:flex}
#ti{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #ff2a52;background:rgba(40,0,12,.85);color:#fff;font-size:1rem;outline:0}
#tf button{padding:0 18px;border:0;border-radius:12px;background:#ff2a52;color:#fff;font-weight:600}
#set{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:9}
#set.show{display:flex}
.sheet{width:100%;max-height:85%;overflow:auto;background:#17000b;border-top:1px solid #ff2a52;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.sheet h2{margin:0 0 14px;font-size:1.1rem}
.sheet label{display:block;margin:14px 0 6px;color:#ffb3c2;font-size:.85rem}
.sheet select,.sheet input[type=range]{width:100%}
.sheet select{padding:11px;border-radius:10px;background:#2a0014;color:#fff;border:1px solid #ff2a52;font-size:.95rem}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid #ff2a52;background:#2a0014;color:#fff;font-size:.95rem}
.row button.p{background:#ff2a52}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="top">
  <div class="pill"><i></i><span id="nm"></span></div>
  <div style="display:flex;gap:8px"><button class="ic" id="hf" aria-label="Hands-free">∞</button><button class="ic" id="gear" aria-label="Settings">⚙</button></div>
</div>
<div class="dock">
  <div id="chat"></div>
  <div id="hint">Tap the glowing orb to speak</div>
  <div class="bar"><button class="ic" id="kb" aria-label="Keyboard">⌨</button><button class="big" id="mic" aria-label="Speak">🎤</button><button class="ic" id="stop" aria-label="Stop">■</button></div>
  <form id="tf"><input id="ti" placeholder="Type a message…" autocomplete="off"><button>Send</button></form>
</div>
<div id="set"><div class="sheet">
  <h2>Voice settings</h2>
  <label>Voice (from your phone)</label><select id="vsel"></select>
  <label>Style</label><select id="ssel"></select>
  <label>Speed</label><input type="range" id="rate" min="0.6" max="1.5" step="0.05">
  <div class="row"><button id="test">Test voice</button><button class="p" id="close">Done</button></div>
</div></div>

<script>
const NAME="Cboom AI";
const $=id=>document.getElementById(id);
$("nm").textContent=NAME;

/* ---------- settings ---------- */
const STYLES={normal:["Normal",1,1],deep:["Deep",.6,.92],bright:["Bright",1.45,1.05],robot:["Robot",.75,.88],fast:["Quick",1.1,1.25],calm:["Calm",.9,.8]};
let S={voice:"",style:"normal",rate:1,hands:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("cboomai")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cboomai",JSON.stringify(S))}catch(e){}};

/* ---------- orb ---------- */
const cv=$("orb"),cx=cv.getContext("2d");
let W,H,R,D=window.devicePixelRatio||1,state="idle",t=0,amp=.04;
function size(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;R=Math.min(W,H)*.3}
addEventListener("resize",size);size();
const N=1100,P=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;P.push({x:Math.cos(a)*r,y:y,z:Math.sin(a)*r,s:Math.random()*6})}
function draw(){
  t+=.008;
  const tg={idle:.03,listening:.12,thinking:.08,speaking:.16}[state];
  amp+=(tg-amp)*.05;
  let pulse=0;
  if(state==="speaking")pulse=(Math.sin(t*38)*.5+.5)*(Math.sin(t*11)*.5+.5)*.14;
  if(state==="listening")pulse=(Math.sin(t*9)*.5+.5)*.05;
  const spin=state==="thinking"?t*3:t,cs=Math.cos(spin),sn=Math.sin(spin),cxc=W/2,cyc=H*.36;
  cx.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){
    const p=P[i],x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs,y=p.y;
    const k=1+amp*Math.sin(t*3+p.s)+pulse,per=1.6/(2.3-z),sc=R*k*per;
    const al=.3+.7*(z+1)/2,g=40+Math.max(0,z)*Math.max(0,1-Math.hypot(x,y))*210|0,s=((z+1.2)*1.1+.5)*D;
    cx.fillStyle="rgba(255,"+g+","+(g+22)+","+al+")";
    cx.fillRect(cxc+x*sc,cyc+y*sc,s,s);
  }
  requestAnimationFrame(draw);
}
draw();
function setState(s){state=s;$("mic").classList.toggle("live",s==="listening")}
const hint=t=>$("hint").textContent=t;

/* ---------- chat ---------- */
const msgs=[];
function addMsg(who,text){
  msgs.push({who,text});if(msgs.length>4)msgs.shift();
  $("chat").innerHTML="";
  msgs.forEach(m=>{const d=document.createElement("div");d.className="m "+m.who;const b=document.createElement("b");b.textContent=m.who==="you"?"YOU":NAME.toUpperCase();d.appendChild(b);d.appendChild(document.createTextNode(m.text));$("chat").appendChild(d)});
}

/* ---------- brain (offline answers for now) ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const jokes=["Why do programmers prefer dark mode? Because light attracts bugs.","I told my phone I needed space. Now it won’t stop showing me storage warnings.","Why did the developer go broke? Because he used up all his cache.","There are 10 kinds of people: those who understand binary and those who don’t.","Why was the computer cold? It left its Windows open."];
const facts=["Honey never spoils. People have found edible honey in ancient tombs.","Octopuses have three hearts.","A day on Venus is longer than a year on Venus.","Bananas are berries, but strawberries are not.","Your brain uses about twenty percent of your body’s energy."];
const apps={google:"https://www.google.com",youtube:"https://www.youtube.com",whatsapp:"https://wa.me/",tiktok:"https://www.tiktok.com",instagram:"https://www.instagram.com",facebook:"https://www.facebook.com",gmail:"https://mail.google.com",maps:"https://maps.google.com","play store":"https://play.google.com/store",github:"https://github.com"};
const gs=q=>"https://www.google.com/search?q="+encodeURIComponent(q);
function norm(s){return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9+\-*/.()\s]/g," ").replace(/\s+/g," ").trim()}
function think(raw){
  const q=norm(raw),has=(...w)=>w.some(x=>q.includes(x));let m;
  if(!q)return{t:"I didn’t catch that. Try again."};
  if(/^(hi|hello|hey|yo|hola)\b/.test(q)||has("good morning","good afternoon","good evening"))return{t:pick(["Hello! How can I help you?","Hey there! What can I do for you?","Hi! I’m listening."])};
  if(has("your name","who are you"))return{t:"I’m "+NAME+", your hands-free voice assistant."};
  if(has("who made you","who created you","who built you"))return{t:"I was built by Cboom APKs."};
  if(has("how are you"))return{t:"I’m doing great, thanks for asking. How about you?"};
  if(has("what can you do","help me","your features"))return{t:"I can tell the time and date, do math, tell jokes and facts, flip a coin, roll a dice, open apps like YouTube or WhatsApp, and search Google for you."};
  if(has("what time","the time","current time"))return{t:"It’s "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"."};
  if(has("the date","what day","todays date","date today"))return{t:"Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+"."};
  if(has("flip a coin","toss a coin","coin flip"))return{t:"It’s "+pick(["heads","tails"])+"."};
  if(has("roll a dice","roll a die","roll dice"))return{t:"You rolled a "+(1+Math.floor(Math.random()*6))+"."};
  if(has("joke","make me laugh"))return{t:pick(jokes)};
  if(has("fact"))return{t:pick(facts)};
  if(has("thank"))return{t:pick(["You’re welcome!","Anytime!","Happy to help."])};
  if(/^(bye|goodbye|see you)/.test(q))return{t:"Goodbye! Talk to you soon."};
  if(has("weather","temperature","forecast"))return{t:"I can’t check live weather yet. That will work once the AI connection is added. I can search it on Google for you.",go:gs(raw)};
  if(m=q.match(/^(?:open|launch|start) (.+)$/)){const n=m[1].replace(/^the /,"").replace(/ app$/,"");if(apps[n])return{t:"Opening "+n+".",go:apps[n]};return{t:"I don’t know that app yet. Searching Google for "+n+".",go:gs(n)}}
  if(m=q.match(/^play (.+)$/))return{t:"Searching YouTube for "+m[1]+".",go:"https://www.youtube.com/results?search_query="+encodeURIComponent(m[1])};
  if(m=q.match(/^(?:search|google|look up|search for|find) (?:for )?(.+)$/))return{t:"Searching Google for "+m[1]+".",go:gs(m[1])};
  let e=q.replace(/what is|whats|calculate|how much is|equals|\?/g,"").replace(/plus/g,"+").replace(/minus/g,"-").replace(/multiplied by|times/g,"*").replace(/divided by|over/g,"/").replace(/(\d)\s*x\s*(\d)/g,"$1*$2").trim();
  if(/^[\d+\-*/.()\s]+$/.test(e)&&/\d/.test(e)&&/[+\-*/]/.test(e)){try{const v=Function('"use strict";return ('+e+')')();if(isFinite(v))return{t:"The answer is "+(Math.round(v*1e6)/1e6)+"."}}catch(x){}}
  return{t:"I don’t know that one yet, so I’ll search Google for you.",go:gs(raw)};
}

/* ---------- voice output ---------- */
const hasTTS="speechSynthesis" in window;
const vlist=()=>hasTTS?speechSynthesis.getVoices():[];
function fillVoices(){
  let v=vlist();const en=v.filter(x=>/^en/i.test(x.lang));if(en.length)v=en;
  $("vsel").innerHTML=v.length?"":"<option>Default voice</option>";
  v.forEach(x=>{const o=document.createElement("option");o.value=x.voiceURI;o.textContent=x.name+" ("+x.lang+")";if(x.voiceURI===S.voice)o.selected=true;$("vsel").appendChild(o)});
}
if(hasTTS){fillVoices();speechSynthesis.onvoiceschanged=fillVoices}
Object.keys(STYLES).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=STYLES[k][0];$("ssel").appendChild(o)});
$("ssel").value=S.style;$("rate").value=S.rate;$("hf").classList.toggle("on",S.hands);
function openUrl(u){try{window.open(u,"_blank")||(location.href=u)}catch(e){location.href=u}}
function speak(text,go){
  if(!hasTTS){setState("idle");if(go)openUrl(go);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text),v=vlist().find(x=>x.voiceURI===S.voice),st=STYLES[S.style]||STYLES.normal;
  if(v){u.voice=v;u.lang=v.lang}
  u.pitch=st[1];u.rate=Math.min(2,S.rate*st[2]);
  setState("speaking");
  let done=false;
  const end=()=>{if(done)return;done=true;setState("idle");if(go)openUrl(go);else if(S.hands)setTimeout(listen,350)};
  u.onend=end;u.onerror=end;
  speechSynthesis.speak(u);
}

/* ---------- voice input ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function handle(text){
  addMsg("you",text);setState("thinking");hint("Thinking…");
  const r=think(text);
  setTimeout(()=>{addMsg("ai",r.t);hint("Tap the glowing orb to speak");speak(r.t,r.go)},350);
}
function listen(){
  if(!SR){hint("Voice input isn’t available here. Use the keyboard button to type.");return}
  if(listening){try{rec.stop()}catch(e){}return}
  if(hasTTS)speechSynthesis.cancel();
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;
  let fin="";
  rec.onstart=()=>{listening=true;setState("listening");hint("Listening…")};
  rec.onresult=e=>{let s="";for(const r of e.results){s+=r[0].transcript;if(r.isFinal)fin=s}hint(s||"Listening…")};
  rec.onerror=e=>{listening=false;setState("idle");hint(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone is blocked. Allow it in your phone settings.":"I didn’t catch that. Tap to try again.")};
  rec.onend=()=>{listening=false;if(fin)handle(fin);else if(state==="listening"){setState("idle");hint("Tap the glowing orb to speak")}};
  try{rec.start()}catch(e){}
}

/* ---------- events ---------- */
$("orb").onclick=listen;$("mic").onclick=listen;
$("stop").onclick=()=>{if(hasTTS)speechSynthesis.cancel();try{rec&&rec.abort()}catch(e){}listening=false;setState("idle");hint("Tap the glowing orb to speak")};
$("kb").onclick=()=>{$("tf").classList.toggle("show");if($("tf").classList.contains("show"))$("ti").focus()};
$("tf").onsubmit=e=>{e.preventDefault();const v=$("ti").value.trim();if(v){$("ti").value="";handle(v)}};
$("hf").onclick=()=>{S.hands=!S.hands;$("hf").classList.toggle("on",S.hands);save();hint(S.hands?"Hands-free is on":"Hands-free is off")};
$("gear").onclick=()=>$("set").classList.add("show");
$("close").onclick=()=>$("set").classList.remove("show");
$("vsel").onchange=e=>{S.voice=e.target.value;save()};
$("ssel").onchange=e=>{S.style=e.target.value;save()};
$("rate").oninput=e=>{S.rate=+e.target.value;save()};
$("test").onclick=()=>speak("Hello, I’m "+NAME+". This is how I sound.");
addMsg("ai","Hi, I’m "+NAME+". Tap the orb and ask me something, like “what time is it?”");
</script>
</body>
</html>
